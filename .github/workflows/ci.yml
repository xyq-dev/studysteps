name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AUTH_TEST_MODE: '1'
      NODE_ENV: test
      CI_PG_DB: studysteps
      CI_PG_APP_USER: stp004_api
      STP004_ADMIN_DATABASE_URL: postgresql://stp004_admin:ci-ephemeral-admin@127.0.0.1:5432/studysteps
      DATABASE_URL: postgresql://stp004_admin:ci-ephemeral-admin@127.0.0.1:5432/studysteps
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stp004_admin
          POSTGRES_PASSWORD: ci-ephemeral-admin
          POSTGRES_DB: studysteps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stp004_admin -d studysteps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Prepare isolated PostgreSQL
        run: node ./scripts/stp004-ci-prepare.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prisma validate
        run: pnpm prisma:validate
