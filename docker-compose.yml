services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studysteps
      POSTGRES_PASSWORD: studysteps
      POSTGRES_DB: studysteps
    ports:
      - "5432:5432"
    volumes:
      - studysteps-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysteps -d studysteps"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studysteps-pg:
